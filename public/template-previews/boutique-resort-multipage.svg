<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Boutique Resort Multi-page template preview</title>
  <desc id="desc">Dark boutique resort multi-page website preview with glass navigation, editorial hero, orange direct booking CTA, room cards, and page modules.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.44" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.52" stop-color="#0369a1"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fed7aa"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#0f172a"/>
  <rect x="0" y="0" width="1200" height="600" fill="url(#hero)"/>
  <circle cx="988" cy="154" r="116" fill="url(#sun)" opacity="0.58"/>
  <circle cx="1002" cy="166" r="78" fill="#fed7aa" opacity="0.18"/>
  <path d="M0 482 C143 430 237 458 366 386 C518 300 641 364 770 280 C913 187 1057 214 1200 132 L1200 604 L0 604 Z" fill="#64748b" opacity="0.22"/>
  <path d="M0 600 L1200 600 L1200 376 C1040 432 938 540 742 500 C568 464 460 552 286 512 C170 486 88 506 0 540 Z" fill="#020617" opacity="0.48"/>

  <g filter="url(#softShadow)">
    <rect x="72" y="34" width="1056" height="76" rx="38" fill="#ffffff" opacity="0.11" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="112" y="81" fill="#f8fafc" font-family="Georgia, serif" font-size="31" font-weight="600">Asteria Resort</text>
    <text x="430" y="77" fill="#f8fafc" fill-opacity="0.78" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">ROOMS</text>
    <text x="536" y="77" fill="#f8fafc" fill-opacity="0.78" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">DINING</text>
    <text x="642" y="77" fill="#f8fafc" fill-opacity="0.78" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">GALLERY</text>
    <text x="766" y="77" fill="#f8fafc" fill-opacity="0.78" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">MORE</text>
    <rect x="916" y="49" width="170" height="46" rx="23" fill="#f97316"/>
    <text x="958" y="79" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Book Direct</text>
  </g>

  <text x="92" y="206" fill="#fb923c" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="5">BOUTIQUE RESORT</text>
  <line x1="92" y1="230" x2="318" y2="230" stroke="#f97316" stroke-width="3"/>
  <text x="86" y="332" fill="#f8fafc" font-family="Georgia, serif" font-size="86" font-weight="600">A private island</text>
  <text x="86" y="426" fill="#f8fafc" font-family="Georgia, serif" font-size="86" font-style="italic" font-weight="500">stay system</text>
  <text x="94" y="486" fill="#e7e5e4" fill-opacity="0.78" font-family="Inter, Arial, sans-serif" font-size="23">Rooms, dining, experiences, reviews, and offers in one polished multi-page flow.</text>
  <rect x="92" y="528" width="204" height="58" rx="29" fill="#f97316" filter="url(#shadow)"/>
  <text x="133" y="565" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Explore Rooms</text>
  <rect x="316" y="528" width="190" height="58" rx="29" fill="#ffffff" opacity="0.10" stroke="#ffffff" stroke-opacity="0.22"/>
  <text x="358" y="565" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">View Pages</text>

  <g filter="url(#shadow)">
    <rect x="748" y="214" width="330" height="294" rx="28" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.20"/>
    <rect x="774" y="240" width="278" height="132" rx="22" fill="url(#pool)"/>
    <path d="M774 352 C818 314 865 337 904 306 C944 274 1000 302 1052 264 L1052 372 L774 372 Z" fill="#ffffff" opacity="0.18"/>
    <text x="780" y="414" fill="#f8fafc" font-family="Georgia, serif" font-size="34" font-weight="600">Ocean Suite</text>
    <text x="780" y="448" fill="#e7e5e4" fill-opacity="0.74" font-family="Inter, Arial, sans-serif" font-size="17">72 sqm / ocean view / private deck</text>
    <text x="780" y="486" fill="#f97316" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="900">$420</text>
    <text x="850" y="486" fill="#e7e5e4" fill-opacity="0.64" font-family="Inter, Arial, sans-serif" font-size="16">/night</text>
  </g>

  <rect x="0" y="600" width="1200" height="300" fill="#f8fafc"/>
  <text x="92" y="678" fill="#0f172a" font-family="Georgia, serif" font-size="46" font-weight="600">Multi-page resort structure</text>
  <text x="92" y="714" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="20">A complete Tree template with page modules and direct booking surfaces.</text>

  <g filter="url(#softShadow)">
    <rect x="92" y="756" width="230" height="92" rx="20" fill="#ffffff"/>
    <circle cx="130" cy="802" r="19" fill="#f97316" opacity="0.18"/>
    <rect x="122" y="794" width="16" height="16" rx="4" fill="#f97316"/>
    <text x="166" y="796" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">Rooms</text>
    <text x="166" y="824" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="15">Shared offers</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="356" y="756" width="230" height="92" rx="20" fill="#ffffff"/>
    <circle cx="394" cy="802" r="19" fill="#f97316" opacity="0.18"/>
    <path d="M386 810 L394 790 L402 810 Z" fill="#f97316"/>
    <text x="430" y="796" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">Dining</text>
    <text x="430" y="824" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="15">Preset page</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="620" y="756" width="230" height="92" rx="20" fill="#ffffff"/>
    <circle cx="658" cy="802" r="19" fill="#f97316" opacity="0.18"/>
    <rect x="648" y="792" width="20" height="20" rx="5" fill="#f97316"/>
    <circle cx="666" cy="794" r="4" fill="#fed7aa"/>
    <text x="694" y="796" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">Gallery</text>
    <text x="694" y="824" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="15">Visual story</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="884" y="756" width="224" height="92" rx="20" fill="#ffffff"/>
    <circle cx="922" cy="802" r="19" fill="#f97316" opacity="0.18"/>
    <path d="M914 803 C920 790 928 790 934 803" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
    <text x="958" y="796" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">Offers</text>
    <text x="958" y="824" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="15">Campaigns</text>
  </g>
</svg>
