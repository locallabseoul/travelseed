  <g filter="url(#shadow)">
    <rect x="446" y="796" width="310" height="74" fill="#222b24"/>
    <rect x="446" y="796" width="96" height="74" fill="#151b17"/>
    <text x="566" y="828" fill="#f8f7f4" font-family="Georgia, serif" font-size="26">Garden Suite</text>
    <text x="566" y="854" fill="#d4af37" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2">VIEW DETAILS</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="800" y="796" width="310" height="74" fill="#222b24"/>
    <rect x="800" y="796" width="96" height="74" fill="#8a6d4b" opacity="0.78"/>
    <text x="920" y="828" fill="#f8f7f4" font-family="Georgia, serif" font-size="26">Family Villa</text>
    <text x="920" y="854" fill="#d4af37" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2">VIEW DETAILS</text>
