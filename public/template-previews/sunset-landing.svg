  <text x="309" y="404" fill="#ffffff" font-family="Georgia, serif" font-size="76" font-weight="600">under painted skies</text>
  <text x="336" y="461" fill="#ffffff" fill-opacity="0.88" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400">A warm, intimate villa for two with sunset views.</text>
