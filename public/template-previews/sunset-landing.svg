    <text x="474" y="849" fill="#e85d75" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">$140</text>
    <text x="536" y="849" fill="#2d3e50" fill-opacity="0.6" font-family="Inter, Arial, sans-serif" font-size="17">/night</text>
  </g>
